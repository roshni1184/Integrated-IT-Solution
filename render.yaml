services:
  - type: web
    name: integrated-it-solution-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: integrated-it-solution
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
